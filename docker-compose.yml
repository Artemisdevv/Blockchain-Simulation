name: blockchain-simulation

services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ALICE_API_PROXY_TARGET: http://peer-alice:6000
      ALICE_WS_PROXY_TARGET: http://peer-alice:6001
      BOB_API_PROXY_TARGET: http://peer-bob:6000
      BOB_WS_PROXY_TARGET: http://peer-bob:6001
      PEER_MANAGER_API_PROXY_TARGET: http://peer-manager:7001
      PEER_MANAGER_WS_PROXY_TARGET: http://peer-manager:7002
    depends_on:
      peer-manager:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy

  signalling:
    build:
      context: .
      dockerfile: Dockerfile.signalling
    ports:
      - "7000:7000"
    healthcheck:
      # A bare TCP connect (what this used to be) makes the websockets
      # server log a spurious "invalid HTTP request" error on every probe -
      # see signalling/healthcheck.py for why.
      test: ["CMD", "python", "-m", "signalling.healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  peer-manager:
    build:
      context: .
      dockerfile: Dockerfile.peer
    command: ["python", "peer_manager.py"]
    depends_on:
      signalling:
        condition: service_healthy
    environment:
      PEER_ADVERTISE_HOST: peer-manager
      SIGNALLING_HOST: signalling
      SIGNALLING_PORT: "7000"
      PEER_MANAGER_BASE_PORT: "5100"
      PEER_MANAGER_PORT_STEP: "100"
      PEER_MANAGER_MAX_PEERS: "9"

  peer-alice:
    # Opt-in demo node: docker compose --profile demo up
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.peer
    # The CLI menu loop calls input() unconditionally - without a tty that's
    # an immediate EOFError and the whole process dies. A tty makes it block
    # instead, which is fine: pos peers are driven via the web API, the menu
    # just sits there unused.
    tty: true
    stdin_open: true
    depends_on:
      signalling:
        condition: service_healthy
    environment:
      PEER_HOST: peer-alice
      PEER_PORT: "5000"
      PEER_NAME: alice
      CONSENSUS: pos
      DISK_LOAD: "n"
      DISK_SAVE: "n"
      ACTION: room
      SIGNALLING_HOST: signalling
      SIGNALLING_PORT: "7000"
      ROOM_ID: demo
      MALICIOUS: "n"
      STAKER: "y"
      AUTO_STAKE: "true"
      WEBAPI_TOKEN: demo-token-alice
      # web/vite.config.ts (via @lovable.dev/vite-tanstack-config) hardcodes
      # the dev server to port 8080, not Vite's usual 5173 default - keeping
      # both since 5173 doesn't hurt and covers anyone running plain `vite`.
      WEBAPI_CORS_ORIGINS: ${WEBAPI_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "6001:6000"  # web API
      - "6002:6001"  # events websocket
    healthcheck:
      # Room-joining is a race: whichever node's join_room() call lands
      # first in an empty room creates genesis, and the web API answers
      # before that's even decided (see webapi/healthcheck.py). Without
      # this, bob/mallory/swarm depending on "service_started" could win
      # the race against alice and end up creating their own genesis
      # instead of joining hers - each node minting its own economy.
      test: ["CMD", "python", "-m", "webapi.healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  peer-bob:
    # Opt-in demo node: docker compose --profile demo up
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.peer
    tty: true
    stdin_open: true
    depends_on:
      signalling:
        condition: service_healthy
      peer-alice:
        condition: service_healthy
    environment:
      PEER_HOST: peer-bob
      PEER_PORT: "5000"
      PEER_NAME: bob
      CONSENSUS: pos
      DISK_LOAD: "n"
      DISK_SAVE: "n"
      ACTION: room
      SIGNALLING_HOST: signalling
      SIGNALLING_PORT: "7000"
      ROOM_ID: demo
      MALICIOUS: "n"
      STAKER: "y"
      AUTO_STAKE: "false"
      WEBAPI_TOKEN: demo-token-bob
      WEBAPI_CORS_ORIGINS: ${WEBAPI_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "6011:6000"
      - "6012:6001"

  peer-mallory:
    # Opt-in demo node: docker compose --profile demo up
    profiles: ["demo"]
    # Malicious node (mal_node.py) - double-signs to demo the slashing
    # detection fixed in issue #3. No web API on malicious peers by design
    # (see enable_api in start_peer.py), so no ports published here.
    build:
      context: .
      dockerfile: Dockerfile.peer
    tty: true
    stdin_open: true
    depends_on:
      signalling:
        condition: service_healthy
      peer-alice:
        condition: service_healthy
    environment:
      PEER_HOST: peer-mallory
      PEER_PORT: "5000"
      PEER_NAME: mallory
      CONSENSUS: pos
      DISK_LOAD: "n"
      DISK_SAVE: "n"
      ACTION: room
      SIGNALLING_HOST: signalling
      SIGNALLING_PORT: "7000"
      ROOM_ID: demo
      MALICIOUS: "y"

  peer-swarm:
    # Opt-in demo node: docker compose --profile demo up
    profiles: ["demo"]
    # Anonymous, scalable filler nodes for a "look, it handles N nodes"
    # moment - not part of the named demo story (that's alice/bob/mallory).
    # Run with: docker compose up --scale peer-swarm=10 -d
    # No fixed name/ports (can't be, when scaled) - PEER_NAME collisions are
    # already handled by the app itself (get_unique_name appends a counter),
    # and AUTO_DETECT_HOST makes each replica advertise its own real IP
    # instead of a shared hostname that would only resolve to one of them.
    build:
      context: .
      dockerfile: Dockerfile.peer
    tty: true
    stdin_open: true
    depends_on:
      signalling:
        condition: service_healthy
      peer-alice:
        condition: service_healthy
    environment:
      AUTO_DETECT_HOST: "true"
      PEER_PORT: "5000"
      PEER_NAME: swarm
      CONSENSUS: pos
      DISK_LOAD: "n"
      DISK_SAVE: "n"
      ACTION: room
      SIGNALLING_HOST: signalling
      SIGNALLING_PORT: "7000"
      ROOM_ID: demo
      MALICIOUS: "n"
      STAKER: "n"
